[project]
name = "arpa"
version = "0.1.0"
description = "Autonomous Research Paper Reproduction Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "docker>=7.0",
    "loguru>=0.7",
    "pypdf>=4.0",
    "langgraph>=1.2",
    "langchain-core>=1.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "datasets>=2.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
